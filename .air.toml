# Air development configuration for go-meta, used by `meta dev`.
#
# Air version this config targets: github.com/air-verse/air v1.67.x
# (v1.52+ syntax: build.entrypoint; build.bin is deprecated and unused).
#
# P2-A03 scope: Go backend hot reload plus automatic templ and route
# regeneration. build.cmd chains generation before compilation:
#
#   air -> meta devgen (templ generate + routegen when inputs changed)
#       -> go build
#       -> restart server
#
# Loop safety (blueprint A03 §9):
#   - Generation writes are skip-if-same; unchanged outputs keep their
#     mtimes, so a no-op build cycle cannot retrigger another cycle.
#   - _templ.go files stay watched (include_ext "go"): they change only
#     when a real .templ edit changed them, producing exactly one rebuild.
#   - meta dev reconciles route filenames every two seconds and writes a
#     hidden, Go-ignored .go trigger only on changes. Air watches that file
#     and runs devgen before rebuilding; consistency checking remains a
#     recovery mechanism for missed events.
#   - Vite handles Svelte edits; the reconciler requests builds when
#     route declaration filenames change.

root = "."
tmp_dir = ".tmp/air"

[build]
  # meta binary path: Air runs from the project root; bin/meta is the
  # committed location for locally built CLI binaries.
  # devgen exits 0 on no-op so routine Go-only edits don't fail.
  cmd = "bin/meta devgen && go build -o ./.tmp/air/server ./cmd/example"
  entrypoint = ["./.tmp/air/server"]
  # Svelte content edits belong to Vite. The route reconciler asks Air
  # to rebuild when page/layout declarations are added, removed or moved.
  include_ext = ["go", "templ"]
  # Generated Go sources stay compilable: they remain inside the watched
  # tree with extension go. Exclusions below remove only non-input dirs.
  exclude_dir = ["node_modules", "dist", ".tmp", ".git", "test-results", "playwright-report"]
  exclude_regex = ["_test.go"]
  delay = 500

[misc]
  # Remove stale build outputs when air exits cleanly.
  clean_on_exit = true
