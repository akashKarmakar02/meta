# Air development configuration for go-meta, used by `meta dev` (P2-A02).
#
# Air version this config targets: github.com/air-verse/air v1.67.x
# (v1.52+ syntax: build.entrypoint; build.bin is deprecated and unused).
#
# Scope (P2-A02): Go backend hot reload only. templ regeneration (A03),
# Vite HMR (A04), and the unified dev origin (A05) extend this file or
# replace it later. `.templ` events intentionally do not trigger anything
# yet; editing a .templ file requires `make generate` until A03 lands.
#
# Prerequisite: the client bundle must exist (the example server fails
# fast without dist/client). Run `make build` once, or `npm run build`,
# before `meta dev`.

root = "."
tmp_dir = ".tmp/air"

[build]
  # Build the Fiber example server into Air's tmp dir. Never build or run
  # meta itself here: air -> go build ./cmd/example -> server, no recursion.
  cmd = "go build -o ./.tmp/air/server ./cmd/example"
  # Run the built server directly; PORT env still overrides :3000.
  entrypoint = ["./.tmp/air/server"]
  include_ext = ["go"]
  # Generated Go sources (*_templ.go, generated/) stay watched and
  # compilable; they only change via make generate, so no self-triggering
  # rebuild loop exists in A02 (full templ wiring is A03).
  exclude_dir = ["node_modules", "dist", ".tmp", ".git", "test-results", "playwright-report"]
  exclude_regex = ["_test.go"]
  delay = 500

[misc]
  # Remove stale build outputs when air exits cleanly.
  clean_on_exit = true
